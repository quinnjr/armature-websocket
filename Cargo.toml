[package]
name = "armature-websocket"
version = "0.3.1"
edition = "2024"
rust-version = "1.94.1"
authors = ["Joseph Quinn <quinn.josephr@proton.me>"]
license = "Apache-2.0"
repository = "https://github.com/quinnjr/armature-websocket"
homepage = "https://quinnjr.github.io/armature"
description = "WebSocket server and client support for Armature using tokio-tungstenite"
keywords = ["websocket", "async", "realtime", "tokio", "tungstenite"]
categories = ["network-programming", "asynchronous", "web-programming"]

[dependencies]
# Logging
armature-log = { version = "0.2" }

# WebSocket
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
tungstenite = "0.30"

# Async runtime
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tokio-stream = { version = "0.1", features = ["net"] }

# HTTP (for upgrade handling)
http = "1.5"
http-body = "1.1"
http-body-util = "0.1"
bytes = "1.12"
hyper = { version = "1.11", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"

# Tracing
tracing = "0.1"

# Utilities
async-trait = "0.1"
futures = "0.3"
futures-util = { version = "0.3", features = ["sink"] }
parking_lot = "0.12"
dashmap = "6.2"
uuid = { version = "1.26", features = ["v4"] }
url = "2.5"

# Optional: Rustls support
# TLS is rustls-only per AGENTS.md; no native-tls path is offered.
tokio-rustls = { version = "0.26", optional = true }
rustls = { version = "0.23", optional = true }

[features]
default = ["rustls-tls"]
rustls-tls = ["dep:tokio-rustls", "dep:rustls", "tokio-tungstenite/rustls-tls-webpki-roots"]

[dev-dependencies]
cargo-husky = { version = "1.5", default-features = false, features = ["user-hooks"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "test-util"] }
tokio-test = "0.4"

